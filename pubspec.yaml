name: neximmo_app
description: "Offline-first desktop deal analyzer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  uuid: ^4.5.1
  pdf: ^3.11.3
  csv: ^6.0.0
  archive: ^3.6.1
  crypto: ^3.0.6
  fl_chart: ^0.69.2
  web: ^1.1.1
  supabase_flutter: 2.15.4
  # Already resolved in the tree as a transitive dependency of supabase_flutter,
  # which uses it for exactly this purpose. Declared directly because the
  # desktop auth callback observer imports it; no new package enters the build.
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Liquid Enterprise typography (docs/architecture/phase_2/03_design_system.md).
  # Bundled, not CDN-loaded — the app is offline-first. All three families are
  # SIL Open Font License 1.1; the license texts ship next to the files.
  fonts:
    # UI and body text. Static instances, so `fontWeight` resolves natively.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Headlines only. Variable font: weight comes from `fontVariations` in
    # AppTheme's text theme, not from `fontWeight` (Flutter does not map
    # fontWeight onto a variable font's wght axis).
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    # Asset IDs and financial values — tabular alignment.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
