name: Debug Operational Tasks

on:
  pull_request:
    paths:
      - 'lib/features/platform_audit_jobs/application/operational_tasks_controller.dart'
      - 'lib/ui/screens/tasks/operational_tasks_panel.dart'
      - 'test/features/platform_audit_jobs/operational_tasks_controller_test.dart'
      - 'test/ui/screens/tasks/operational_tasks_panel_test.dart'
      - '.github/workflows/debug-operational-tasks.yml'

permissions:
  contents: read

concurrency:
  group: debug-operational-tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run operational Task tests with expanded output
        run: |
          flutter test --no-pub -r expanded \
            test/features/platform_audit_jobs/operational_tasks_controller_test.dart \
            test/ui/screens/tasks/operational_tasks_panel_test.dart
