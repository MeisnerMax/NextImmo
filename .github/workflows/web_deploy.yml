name: Web App Deploy

# Deploys the Flutter web app -- the product, not the marketing site. Marketing
# lives in its own Vercel project built from marketing/ and is never touched
# here (see docs/architecture/cloud/01_target_cloud_architecture.md).
#
# AUTOMATIC after a green protected-main CI run. The chain is:
#
#   PR -> required CI -> merge to protected main -> the `Flutter` workflow runs
#   on that push -> if it succeeds, this workflow fires via workflow_run and
#   deploys that exact commit as a Vercel PREVIEW.
#
# This is not a bare push-deploy and it is not Vercel's own Git integration.
# The Flutter toolchain still builds `build/web` in GitHub Actions and the
# Vercel CLI only uploads the finished artifact. Vercel's Git integration stays
# disconnected (DEPLOY-DRIFT-02) and the root vercel.json keeps
# git.deploymentEnabled=false as a second, independent guard.
#
# Still fail-closed on two independent gates, so an unconfigured repository
# cannot deploy:
#
#   1. the repository variable STAGING_DEPLOY_ENABLED must equal "true". It is
#      not a secret and is deliberately unset until an owner flips it. Until
#      then the deploy job never runs, so it also cannot create the `staging`
#      environment in the unguarded state GitHub gives a first-referenced one.
#   2. inside the `staging` environment, all five values the deploy needs must
#      be present. Presence only -- no value is ever printed.
#
# workflow_run runs with access to secrets even though the triggering workflow
# did not, so the eligibility gate below is deliberately strict: it deploys only
# a successful push to main of this very repository, only the SHA that is still
# the current tip of main, and only when the four named checks are green on it.
#
# Production is intentionally absent: no --prod, no --target, no production
# alias, no custom domain. Promotion stays a separate, manual decision.
#
# Required values, all inside the `staging` environment:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_APP
#   SUPABASE_URL_STAGING, SUPABASE_PUBLISHABLE_KEY_STAGING
# Only the publishable key may ever reach a client build. Service role key,
# secret key, DB password and access token are server-only
# (phase_1/01_environment_contract.md).

on:
  workflow_run:
    # The exact name of the CI workflow in .github/workflows/flutter.yml.
    workflows:
      - Flutter
    types:
      - completed
    # Only completions of `Flutter` runs that happened on main are considered;
    # the job-level guard below re-checks this and more before anything runs.
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  # A newer eligible run cancels an older in-flight one: staging should reflect
  # the newest green main, never an older deploy that finished last. The
  # stale-main guard in `gate` is the second half of that guarantee.
  group: web-deploy-staging
  cancel-in-progress: true

env:
  # Pinned rather than @latest: a deploy that cannot be reproduced tomorrow is
  # not evidence of anything. Bump deliberately, in its own reviewed change.
  VERCEL_CLI_VERSION: '58.9.0'

jobs:
  # No environment and no secrets here: eligibility is decided entirely from the
  # event payload and public API before the `staging` environment is touched.
  gate:
    runs-on: ubuntu-latest
    # Every clause must hold. Because workflow_run can read secrets, none of
    # these may be skipped: a successful *push* (not a PR run, not a manual
    # dispatch of Flutter) on *main* of *this* repository (not a fork), with the
    # kill switch explicitly on.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'MeisnerMax/NextImmo' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      deploy_sha: ${{ steps.sha.outputs.deploy_sha }}
    steps:
      - name: Resolve the triggering commit
        id: sha
        run: |
          # For workflow_run, GITHUB_SHA points at the tip of the default
          # branch, not the commit that triggered the upstream run. head_sha is
          # the authoritative one and everything downstream uses only this.
          deploy_sha='${{ github.event.workflow_run.head_sha }}'
          if ! printf '%s' "$deploy_sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Unexpected head_sha '$deploy_sha'."
            exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "Triggering commit: $deploy_sha"

      - name: Decide whether this commit is still the deployable tip of main
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.sha.outputs.deploy_sha }}
        run: |
          # An older CI run must never overwrite a newer staging state. If main
          # has already moved past the triggering commit, skip cleanly -- this
          # is a no-op, not a failure, and needs no secrets.
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$DEPLOY_SHA" ]; then
            echo "::notice::Trigger SHA is no longer current main; stale staging deployment skipped."
            echo "  trigger: $DEPLOY_SHA"
            echo "  current: $current"
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Belt and suspenders: the Flutter run already concluded success, but
          # confirm the four named checks are individually green on this exact
          # commit before we touch the environment.
          missing=''
          for check in verify supply_chain marketing database; do
            conclusion="$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_SHA/check-runs" \
              --jq ".check_runs[] | select(.name==\"$check\") | .conclusion" | head -n1)"
            if [ "$conclusion" != "success" ]; then
              missing="$missing $check(${conclusion:-absent})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Required checks are not green on $DEPLOY_SHA; deployment skipped:$missing"
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'proceed=true' >> "$GITHUB_OUTPUT"
          echo "Deployable: $DEPLOY_SHA is current main and green."

  deploy_staging:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact triggering commit, never a moving ref: the artifact has to
          # be traceable to one SHA, and that SHA is what is re-verified below.
          # No artifact from the upstream Flutter run is trusted or downloaded;
          # the source is checked out fresh here.
          ref: ${{ needs.gate.outputs.deploy_sha }}
          persist-credentials: false

      - name: Confirm the deployed commit
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out $actual but was asked for $DEPLOY_SHA."
            exit 1
          fi
          echo "Deploying $actual"

      - name: Require the four checks to be green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
        run: |
          # A staging deploy of a commit that never passed CI would make the
          # environment meaningless as a test of that commit.
          missing=''
          for check in verify supply_chain marketing database; do
            conclusion="$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_SHA/check-runs" \
              --jq ".check_runs[] | select(.name==\"$check\") | .conclusion" | head -n1)"
            if [ "$conclusion" != "success" ]; then
              missing="$missing $check(${conclusion:-absent})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required checks are not green on $DEPLOY_SHA:$missing"
            exit 1
          fi

      - name: Require all five deploy values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_APP: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          SUPABASE_URL_STAGING: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_PUBLISHABLE_KEY_STAGING: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING }}
        run: |
          # Presence only. Naming which one is missing is safe; printing any
          # value is not. Exactly these five, no sixth: no service role key, no
          # DB password, no access token belongs in a client build.
          missing=''
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_APP \
                      SUPABASE_URL_STAGING SUPABASE_PUBLISHABLE_KEY_STAGING; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Staging deploy is incompletely configured; missing:$missing"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      # Flutter is pinned to the same version the verify job uses. Building here
      # rather than in Vercel's build image is deliberate: Vercel has no Flutter
      # toolchain, and a drifting SDK version would deploy something CI never
      # tested.
      - name: Build web for staging
        run: |
          flutter build web --no-pub --release \
            --dart-define=NEXIMMO_ENV=staging \
            --dart-define=NEXIMMO_DATA_BACKEND=supabase \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING }}

      - name: Verify the artifact before it leaves CI
        run: |
          test -f build/web/index.html || { echo '::error::build/web/index.html is missing.'; exit 1; }
          test -f build/web/vercel.json || { echo '::error::build/web/vercel.json is missing; the SPA fallback would be absent and every path route would 404.'; exit 1; }

          destination="$(jq -r '.rewrites[0].destination' build/web/vercel.json)"
          [ "$destination" = "/index.html" ] || { echo "::error::SPA rewrite points at $destination."; exit 1; }

          # The artifact is public the moment it is deployed.
          if grep -rqE 'service_role|SUPABASE_SECRET|SERVICE_ROLE_KEY|sb_secret' build/web; then
            echo '::error::The artifact contains a server-only credential marker.'
            exit 1
          fi
          if jq -e '.git' build/web/vercel.json >/dev/null 2>&1; then
            echo '::error::The artifact carries a git policy; that belongs to the repository root.'
            exit 1
          fi

      # No --prod and no --target: a preview deployment. Production would need an
      # authorized decision that does not exist. Because Vercel's Git integration
      # is disconnected, the commit attribution is supplied explicitly via
      # --meta so the deployment is still traceable to this exact main commit.
      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
        run: |
          # stdout of `vercel deploy` is always the deployment URL. It is not a
          # secret; the token is passed via env and never printed.
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy build/web \
            --token="$VERCEL_TOKEN" \
            --yes \
            --meta githubDeployment=1 \
            --meta githubCommitRef=main \
            --meta "githubCommitSha=$DEPLOY_SHA" \
            --meta githubOrg=MeisnerMax \
            --meta githubRepo=NextImmo)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url"

      # A stable staging address, updated to point at each newest preview. This
      # step is inert until an owner sets the repository variable
      # VERCEL_STAGING_ALIAS to a proven, free *.vercel.app host -- so the first
      # ever deploy cannot fail here for lack of a stable address. No custom
      # domain, no DNS.
      - name: Point the stable staging alias at this preview
        if: vars.VERCEL_STAGING_ALIAS != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS }}
        run: |
          npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set "$DEPLOYMENT_URL" "$STAGING_ALIAS" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
          echo "Stable staging alias $STAGING_ALIAS -> $DEPLOYMENT_URL"

      - name: Note when no stable alias is configured yet
        if: vars.VERCEL_STAGING_ALIAS == ''
        run: |
          echo "::notice::No stable staging alias configured; set the repository variable VERCEL_STAGING_ALIAS to a proven *.vercel.app host to enable it. Preview URL: ${{ steps.deploy.outputs.url }}"
