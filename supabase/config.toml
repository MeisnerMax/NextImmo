project_id = "neximmo-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
# Off by design. supabase/seed.sql is a manual bootstrap fixture -- its own
# header says to apply it with `psql -f`, and tool/bootstrap_p2_x01_local.ps1 is
# the only consumer, which does exactly that. Every tool/verify_*.ps1 script and
# the CI database job reset with --no-seed.
#
# Leaving it on was not harmless: `supabase migration down` performs a full
# reset and seeds as part of it, with no --no-seed flag of its own. So the CI
# rollback replay started from an unseeded database and silently became a seeded
# one, and the final `supabase test db` then died in 25 pgTAP files on
# `permissions_key_unique` -- the fixtures insert their own permission catalogue
# because migrations deliberately do not seed one.

enabled = false

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"
